<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Nuevo Cliente</h3>
      <button class="close-button" (click)="onClose()">×</button>
    </div>
    
    <div class="modal-body">
      <form>
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre"
            [(ngModel)]="cliente.Nombre" 
            placeholder="Ingrese el nombre completo"
            required>
        </div>

        <div class="form-group">
          <label for="identificacion">Identificación</label>
          <input 
            type="text" 
            id="identificacion" 
            name="identificacion"
            [(ngModel)]="cliente.Identificacion" 
            placeholder="Ingrese la identificación"
            required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="genero">Género</label>
            <select id="genero" name="genero" [(ngModel)]="cliente.Genero" required>
              <option value="">Seleccione</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="edad">Edad</label>
            <input 
              type="number" 
              id="edad" 
              name="edad"
              [(ngModel)]="cliente.Edad" 
              placeholder="Edad"
              min="1"
              max="150"
              required>
          </div>
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input 
            type="text" 
            id="direccion" 
            name="direccion"
            [(ngModel)]="cliente.Direccion" 
            placeholder="Ingrese la dirección"
            required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input 
            type="tel" 
            id="telefono" 
            name="telefono"
            [(ngModel)]="cliente.Telefono" 
            placeholder="Ingrese el teléfono"
            required>
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input 
            type="password" 
            id="contrasena" 
            name="contrasena"
            [(ngModel)]="cliente.Contrasena" 
            placeholder="Ingrese la contraseña"
            required>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="onClose()">Cancelar</button>
      <button class="btn btn-primary" (click)="onSave()">Guardar</button>
    </div>
  </div>
</div>
